<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <title>grid-sample</title>
</head>
<body>
  <form data-owner-agent="grid-sample" data-form-version="1">
    <fieldset class="field-group field-radio">
      <legend id="label-rating">評分 <span class="req">*</span></legend>
      <div class="radio-group">
        <label class="radio-item"><input type="radio" name="rating" value="1" required /><span>1</span></label>
        <label class="radio-item"><input type="radio" name="rating" value="2" /><span>2</span></label>
        <label class="radio-item"><input type="radio" name="rating" value="3" /><span>3</span></label>
      </div>
    </fieldset>
    <fieldset class="field-grid" data-field-id="history" data-grid>
      <legend id="label-history">歷史收支</legend>
      <div class="grid-scroll">
        <table class="grid-table">
          <thead>
            <tr>
              <th scope="col" aria-hidden="true"></th>
              <th scope="col" data-grid-column-id="revenue">Total Revenue (HK$) <span class="req">*</span></th>
              <th scope="col" data-grid-column-id="market">Market</th>
              <th scope="col" data-grid-column-id="ok">Confirmed</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row" data-grid-row-id="fy2022">FY2022</th>
              <td><input name="history_fy2022_revenue" type="number" step="0.01" required /></td>
              <td><select name="history_fy2022_market"><option value="">請選擇</option><option value="CN">CN</option><option value="HK">HK</option></select></td>
              <td><input name="history_fy2022_ok" type="checkbox" value="true" /></td>
            </tr>
            <tr>
              <th scope="row" data-grid-row-id="fy2023">FY2023</th>
              <td><input name="history_fy2023_revenue" type="number" step="0.01" required /></td>
              <td><select name="history_fy2023_market"><option value="">請選擇</option><option value="CN">CN</option><option value="HK">HK</option></select></td>
              <td><input name="history_fy2023_ok" type="checkbox" value="true" /></td>
            </tr>
          </tbody>
        </table>
      </div>
    </fieldset>
    <div class="field-group field-textarea">
      <label id="label-remark" for="remark">Remarks</label>
      <textarea id="remark" name="remark"></textarea>
    </div>
    <button type="submit">提交</button>
  </form>
</body>
</html>
