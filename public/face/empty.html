<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>沒有首頁表</title>
  <style>
    :root { color-scheme: light; }
    body {
      margin: 0;
      font: 16px/1.5 "Segoe UI", system-ui, sans-serif;
      color: #171717;
      background: #f3f1eb;
    }
    .top {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid #d6d3cb;
      background: #fff;
    }
    .kicker {
      margin: 0;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #5c5c5c;
    }
    .top h1 { margin: 0.15rem 0 0; font-size: 1.05rem; font-weight: 650; }
    main { max-width: 40rem; margin: 0 auto; padding: 2rem 1rem; }
    p { color: #5c5c5c; margin: 0; }
  </style>
</head>
<body>
  <div class="top">
    <p class="kicker">打開時看到的頁面</p>
    <h1>還沒有表</h1>
  </div>
  <main>
    <p id="empty-note">打開這個 agent 時還沒有要填的表。</p>
  </main>
</body>
</html>
