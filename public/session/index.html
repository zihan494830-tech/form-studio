<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择本地演示身份 · Form Studio</title>
  <link rel="stylesheet" href="/session/styles.css" />
</head>
<body>
  <main class="session-shell" aria-labelledby="session-title">
    <section class="session-card">
      <p class="eyebrow">Form Studio · 本地课堂演示</p>
      <h1 id="session-title">选择这次要体验的身份</h1>
      <p class="lead">这是 Form Studio 自己的本地演示身份，不是 Poffices 登录，也不会获得或扩大 Poffices 权限。</p>
      <p id="current-session" class="current-session" hidden></p>
      <div id="profile-list" class="profile-list" aria-live="polite">
        <p class="state">正在读取可用身份…</p>
      </div>
      <p id="session-error" class="error" role="alert" hidden></p>
      <p class="boundary"><strong>当前用途：</strong>验证学生提交、老师按授权范围查看、作者继续设计三种本地流程。联网试点仍需正式身份提供方。</p>
    </section>
  </main>
  <script type="module" src="/session/main.js"></script>
</body>
</html>
